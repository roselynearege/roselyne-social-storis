
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Pain Nobody Sees</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #100c0c;
    font-family: Georgia, serif;
    color: white;
}

/* MAIN STORY CONTAINER */
.story-box {
    width: 100%;
    max-width: 390px;
    background: linear-gradient(145deg, #302222, #1d1515);
    border: 10px double #bd9476;
    border-radius: 22px;
    padding: 13px;
    text-align: center;
    box-shadow:
        0 0 12px #000,
        0 0 25px rgba(181,138,112,0.35);
}

/* STORY HEADING */
h1 {
    color: #f0c5a6;
    font-family: Georgia, serif;
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 1.5px;
    line-height: 1.3;
    margin: 4px 0 13px;
    text-shadow: 2px 2px 4px #000;
}

/* STORY IMAGE */
.story-image {
    display: block;
    width: 100%;
    height: 180px;
    object-fit: cover;
    object-position: center 25%;
    border-radius: 10px;
    border: 3px solid #bd9476;
    background: #100d0d;
}

/* NARRATION TEXT */
#narration {
    min-height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px 9px;
    font-family: Georgia, serif;
    font-size: 17px;
    font-weight: normal;
    line-height: 1.8;
    letter-spacing: 0.3px;
    color: #fff0e7;
    text-align: center;
    text-shadow: 1px 1px 2px #000;
}

#narration p {
    margin: 0;
    animation: appear 0.7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* BUTTONS */
.controls {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 8px 0;
}

button {
    background: linear-gradient(145deg, #bd805d, #8d543b);
    color: white;
    border: 2px solid #e0b395;
    border-radius: 9px;
    padding: 11px 17px;
    cursor: pointer;
    font-size: 14px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    box-shadow: 0 3px 6px #000;
    transition: 0.3s;
}

button:hover {
    background: #d19a78;
    transform: scale(1.05);
}

/* FOOTER */
.footer {
    font-family: Georgia, serif;
    font-size: 12px;
    font-style: italic;
    color: #d7b9a8;
    margin-top: 12px;
    line-height: 1.6;
    letter-spacing: 0.4px;
}

</style>
</head>

<body>

<div class="story-box">

    <h1>A PAIN NOBODY SEES</h1>

    <img src="Teacher.jpg"
         alt="Story image"
         class="story-image">

    <div id="narration" aria-live="polite">
        <p>Some pain is silent. Some tears are hidden. Press Play to hear our story.</p>
    </div>

    <div class="controls">

        <button onclick="startStory()">▶ Play</button>

        <button onclick="pauseStory()">⏸ Pause</button>

        <button onclick="restartStory()">↻ Restart</button>

    </div>

    <audio id="song" preload="auto">
        <source src="Umeniitika.mp3" type="audio/mpeg">
    </audio>

    <div class="footer">
        A story of loss, betrayal, courage and hope.
    </div>

</div>

<script>

const narration = document.getElementById("narration");
const song = document.getElementById("song");

const sentences = [

"When our parents were alive, we had a home. We had love, protection and a place where we belonged.",

"But the day we lost them, everything changed. The people we thought would protect us became the very people we feared.",

"Relatives started fighting over property. Some wanted us out. Others treated us like strangers in the home where we were born.",

"We were only children trying to understand why life had become so painful.",

"They thought we were weak because we had lost our parents. They thought nobody would stand up for us.",

"But they forgot something. Being an orphan does not mean being worthless. Losing parents does not mean losing our dignity.",

"One day, we will rise above the pain. And the same children they tried to silence will have their own stories to tell.",

"We may have lost our parents, but we have not lost our strength. Our story is not over."

];

let currentIndex = 0;
let playing = false;
let paused = false;
let songStarted = false;
let sequence = 0;
let delayTimer = null;

function getAfricanVoice() {

    const voices = speechSynthesis.getVoices();

    const preferred = [
        /en.ke/i,
        /en.ng/i,
        /en.za/i,
        /en.gh/i
    ];

    for (const pattern of preferred) {
        const voice = voices.find(v => pattern.test(v.lang));
        if (voice) return voice;
    }

    return voices.find(v =>
        /en.*(female|woman)/i.test(v.name)
    ) || voices.find(v =>
        /en-GB/i.test(v.lang)
    ) || voices.find(v =>
        /^en/i.test(v.lang)
    );
}

function showSentence(text) {

    narration.innerHTML = "";

    const p = document.createElement("p");
    p.textContent = text;

    narration.appendChild(p);
}

function readNext(mySequence) {

    if (!playing || paused || mySequence !== sequence) return;

    if (currentIndex >= sentences.length) {
        finishStory(mySequence);
        return;
    }

    const text = sentences[currentIndex];

    showSentence(text);

    const speech = new SpeechSynthesisUtterance(text);

    const voice = getAfricanVoice();

    if (voice) {
        speech.voice = voice;
        speech.lang = voice.lang;
    } else {
        speech.lang = "en-GB";
    }

    speech.rate = 0.82;
    speech.pitch = 0.95;
    speech.volume = 1;

    speech.onend = function() {

        if (!playing || mySequence !== sequence) return;

        currentIndex++;

        delayTimer = setTimeout(function() {
            readNext(mySequence);
        }, 700);

    };

    speech.onerror = function(event) {

        if (mySequence !== sequence) return;

        console.log("Speech error:", event.error);

        playing = false;

        narration.innerHTML =
            "<p>Sorry, narration could not play. Please press Restart and try again.</p>";
    };

    speechSynthesis.speak(speech);
}

function startStory() {

    if (playing) return;

    if (!("speechSynthesis" in window)) {
        narration.innerHTML =
            "<p>Your browser does not support speech narration. Please use Google Chrome.</p>";
        return;
    }

    if (songStarted) {
        restartStory();
        return;
    }

    playing = true;
    paused = false;

    const mySequence = sequence;

    showSentence("Listen carefully. Our story begins...");

    if (speechSynthesis.getVoices().length === 0) {

        speechSynthesis.onvoiceschanged = function() {
            if (playing && mySequence === sequence) {
                readNext(mySequence);
            }
        };

        setTimeout(function() {
            if (playing && mySequence === sequence &&
                speechSynthesis.getVoices().length > 0) {
                readNext(mySequence);
            }
        }, 1000);

    } else {
        readNext(mySequence);
    }
}

function pauseStory() {

    if (!playing || paused) return;

    paused = true;

    if (songStarted) {
        song.pause();
    } else {
        speechSynthesis.pause();
        clearTimeout(delayTimer);
    }

    narration.style.opacity = "0.7";
}

function finishStory(mySequence) {

    if (mySequence !== sequence) return;

    playing = false;
    paused = false;
    songStarted = true;

    showSentence(
        "Our story is not over. We have suffered, but we will rise. Now, let the song speak."
    );

    song.currentTime = 0;
    song.volume = 1;

    song.play().catch(function(error) {
        console.log("Song playback error:", error);

        narration.innerHTML =
            "<p>Our story is not over. Please check that Umeniitika.mp3 is in the same folder.</p>";
    });
}

function restartStory() {

    sequence++;

    playing = false;
    paused = false;
    songStarted = false;

    clearTimeout(delayTimer);

    speechSynthesis.cancel();

    song.pause();
    song.currentTime = 0;

    currentIndex = 0;

    narration.innerHTML =
        "<p>Starting again... Listen to our story.</p>";

    startStory();
}

song.addEventListener("ended", function() {
    showSentence("Our story is not over. We will rise above the pain.");
});

song.addEventListener("error", function() {
    console.log("Please check Umeniitika.mp3.");
});

</script>

</body>
</html>
